name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders so env validation (src/lib/env.ts) passes. Nothing connects to them: the build
      # prerenders without a database, and unit tests don't touch the network.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      APP_SECRET: ci-placeholder-app-secret-not-a-real-key-0123456789
    steps:
      - uses: actions/checkout@v5

      # No version input: the action reads "packageManager" from package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs `next typegen` first, so the global PageProps/LayoutProps types exist.
      - run: pnpm typecheck

      - run: pnpm lint

      # Raw font sizes, radii and hex colours in src/components fail the build.
      - run: pnpm lint:design --strict

      - run: pnpm test

      - run: pnpm build

  migrations:
    name: Migrations apply to a fresh database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v5

      # Pinned to the CLI version the config was last verified with; bump deliberately.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Starts only Postgres (supabase/config.toml, [db]) and applies every file in
      # supabase/migrations in order: the job fails if any migration fails.
      - name: Start Postgres and apply migrations
        run: supabase db start

      - name: List applied migrations
        run: supabase migration list --local

      # The auth trigger creates the profile, default categories and activities, like a real sign-up.
      - name: Create an owner row for the database tests
        run: >
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c
          "insert into auth.users (id, instance_id, email, aud, role)
          values (gen_random_uuid(), '00000000-0000-0000-0000-000000000000', 'ci@example.test', 'authenticated', 'authenticated')"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Database tests (test/db.integration.test.ts)
        run: pnpm exec vitest run test/db.integration.test.ts

      - name: Stop Postgres
        if: always()
        run: supabase stop --no-backup
