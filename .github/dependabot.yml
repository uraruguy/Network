version: 2
updates:
  # pnpm uses the npm ecosystem (reads pnpm-lock.yaml). Majors outside the named groups arrive as
  # single PRs so each breaking change can be read on its own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    # @types/node tracks the runtime (.nvmrc is Node 22): its major moves with the runtime, not before.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      next:
        patterns: ["next", "eslint-config-next", "@next/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "babel-plugin-react-compiler"]
      ai:
        patterns: ["ai", "@ai-sdk/*", "@openrouter/*", "ai-sdk-provider-claude-code", "@modelcontextprotocol/*", "mcp-handler"]
      supabase:
        patterns: ["@supabase/*"]
      tanstack:
        patterns: ["@tanstack/*"]
      tiptap:
        patterns: ["@tiptap/*"]
      serwist:
        patterns: ["serwist", "@serwist/*"]
      drizzle:
        patterns: ["drizzle-orm", "drizzle-kit", "postgres"]
      # Catch-alls. Dependabot puts a package in every group it matches, and a group without patterns
      # outranks a wildcard pattern, so these would take named-group members (@ai-sdk/react away from
      # ai) and split exactly-pinned families. Keep both exclude lists equal to the named groups' patterns.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: ["next", "eslint-config-next", "@next/*",
          "react", "react-dom", "@types/react", "@types/react-dom", "babel-plugin-react-compiler",
          "ai", "@ai-sdk/*", "@openrouter/*", "ai-sdk-provider-claude-code", "@modelcontextprotocol/*", "mcp-handler",
          "@supabase/*",
          "@tanstack/*",
          "@tiptap/*",
          "serwist", "@serwist/*",
          "drizzle-orm", "drizzle-kit", "postgres"]
      minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns: ["next", "eslint-config-next", "@next/*",
          "react", "react-dom", "@types/react", "@types/react-dom", "babel-plugin-react-compiler",
          "ai", "@ai-sdk/*", "@openrouter/*", "ai-sdk-provider-claude-code", "@modelcontextprotocol/*", "mcp-handler",
          "@supabase/*",
          "@tanstack/*",
          "@tiptap/*",
          "serwist", "@serwist/*",
          "drizzle-orm", "drizzle-kit", "postgres"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
